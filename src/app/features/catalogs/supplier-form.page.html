<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/ajustes/proveedores"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar proveedor' : 'Nuevo proveedor' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form" (ngSubmit)="save()">
    <ion-list [inset]="true">
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" formControlName="name" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contacto" labelPlacement="stacked" formControlName="contactName"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Teléfono" labelPlacement="stacked" formControlName="phone"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Correo" labelPlacement="stacked" type="email" formControlName="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-textarea label="Notas" labelPlacement="stacked" formControlName="notes" autoGrow="true"></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-toggle formControlName="active">Activo</ion-toggle>
      </ion-item>
    </ion-list>
    <div class="form-actions">
      <ion-button expand="block" type="submit" [disabled]="saving()">Guardar</ion-button>
    </div>
  </form>
</ion-content>
