<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/ajustes/marcas"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar marca' : 'Nueva marca' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form" (ngSubmit)="save()">
    <app-entity-image
      kind="brands"
      [entityId]="entityId()"
      [imagePath]="imagePath()"
      (imagePathChange)="onImagePathChange($event)"
    />

    <ion-list [inset]="true">
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" formControlName="name" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Proveedor" labelPlacement="stacked" formControlName="supplierId" interface="popover">
          @for (s of suppliers(); track s.id) {
            <ion-select-option [value]="s.id">{{ s.name }}</ion-select-option>
          }
        </ion-select>
      </ion-item>
    </ion-list>
    <div class="form-actions">
      <ion-button expand="block" type="submit" [disabled]="saving()">Guardar</ion-button>
    </div>
  </form>
</ion-content>
